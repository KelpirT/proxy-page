<!DOCTYPE html>
<html>
<head>
  <title>Cổng học tập</title>
  <style>
    body { font-family: sans-serif; padding: 50px; background: #f5f5f5; text-align: center; }
    input { width: 80%; padding: 10px; margin-top: 20px; }
    button { padding: 10px 20px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>🌐 Trình duyệt an toàn</h1>
  <p>Nhập URL bạn muốn truy cập (ví dụ: https://www.tiktok.com)</p>
  <input type="text" id="url" placeholder="https://..." />
  <br/>
  <button onclick="go()">Truy cập</button>

  <script>
    function go() {
      const inputUrl = document.getElementById('url').value;
      const encoded = encodeURIComponent(inputUrl);
      const proxyHost = 'https://detroit-fascinating-browsers-printers.trycloudflare.com/proxy/';
      window.location.href = proxyHost + inputUrl;
    }
  </script>
</body>
</html>
