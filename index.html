<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trình duyệt học tập</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
      background: #f4f4f4;
    }
    input[type="text"] {
      width: 60%;
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <h2>📚 Trình duyệt học tập</h2>
  <p>Nhập URL bạn muốn truy cập:</p>
  <input type="text" id="target" placeholder="https://www.tiktok.com">
  <button onclick="go()">Truy cập</button>

  <script>
    function go() {
      const input = document.getElementById('target').value.trim();
      if (!input.startsWith('http')) {
        alert('Vui lòng nhập URL hợp lệ, ví dụ: https://www.tiktok.com');
        return;
      }
      const proxyBase = 'https://meat-severe-cord-monitoring.trycloudflare.com/proxy/';
      window.location.href = proxyBase + input;
    }
  </script>
</body>
</html>
